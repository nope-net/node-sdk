# Offline gates on every push and pull request. No network calls beyond
# dependency installation, no secrets.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Smoke the built entry points
        run: |
          node -e "const m = require('./dist/index.cjs'); if (typeof m.NopeClient !== 'function') process.exit(1)"
          node --input-type=module -e "import('./dist/index.js').then(m => { if (typeof m.NopeClient !== 'function') process.exit(1) })"
